services:
  nginx:
    container_name: nginx
    image: nginx:1.29
    dns:
      - ${DNS_SERVER}
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./snippets:/etc/nginx/snippets:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NGINX_HOST=lab.home.arpa
      - NGINX_PORT=80
    restart: always
    networks:
      - homelab-net

networks:
  homelab-net:
    external: true
