service:
  db:
    image: postgres:15
    container_name: db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: always
    networks:
      - gitea-net
      - zabbix-net
    expose:
      - "5432"

networks:
  gitea-net:
    external: true
  zabbix-net:
    external: true

volumes:
  db-data: