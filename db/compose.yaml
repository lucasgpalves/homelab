services:
  db:
    image: postgres:15
    container_name: db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - GITEA_DB_USER=${GITEA_DB_USER}
      - GITEA_DB_PASSWD=${GITEA_DB_PASSWD}
      - GITEA_DB_NAME=${GITEA_DB_NAME}
      - ZABBIX_DB_USER=${ZABBIX_DB_USER}
      - ZABBIX_DB_PASSWD=${ZABBIX_DB_PASSWD}
      - ZABBIX_DB_NAME=${ZABBIX_DB_NAME}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    restart: always
    networks:
      - gitea-net
      - zabbix-net
    expose:
      - "5432"

networks:
  gitea-net:
    external: true
  zabbix-net:
    external: true

volumes:
  db-data:
