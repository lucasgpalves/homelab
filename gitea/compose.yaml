services:
  gitea:
    image: gitea/gitea:1.24.6
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=${GITEA_DB_TYPE}
      - GITEA__database__HOST=${GITEA_DB_HOST}
      - GITEA__database__NAME=${GITEA_DB_NAME}
      - GITEA__database__USER=${GITEA_DB_USER}
      - GITEA__database__PASSWD=${GITEA_DB_PASSWD}
      - GITEA__webhook__ALLOWED_HOST_LIST=${GITEA_WEBHOOK_ALLOWED}
      - SSL_CERT_FILE=${SSL_CERT_FILE}
    volumes:
      - gitea-data:/data
      - ./ca-bundle.crt:/etc/ssl/certs/ca-bundle.crt:ro
    ports:
      - "222:22"
    restart: always
    networks:
      - homelab-net
      - gitea-net

networks:
  gitea-net:
    external: true
  homelab-net:
    external: true

volumes:
  gitea-data:
    driver: local