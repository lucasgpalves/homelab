services:
  drone-server:
    image: drone/drone:2.26.0
    container_name: drone-server
    expose:
      - "80"
    volumes:
      - drone-data:/data
      - ./ca-bundle.crt:/etc/ssl/certs/ca-bundle.crt:ro
    restart: always
    environment:
      - DRONE_GITEA_SERVER=${DRONE_GITEA_SERVER}
      - DRONE_GITEA_CLIENT_ID=${DRONE_GITEA_CLIENT_ID}
      - DRONE_GITEA_CLIENT_SECRET=${DRONE_GITEA_CLIENT_SECRET}
      - DRONE_RPC_SECRET=${DRONE_RPC_SECRET}
      - DRONE_SERVER_HOST=${DRONE_SERVER_HOST}
      - DRONE_SERVER_PROTO=${DRONE_SERVER_PROTO:-https}
      - DRONE_USER_CREATE=${DRONE_USER_CREATE}
      - SSL_CERT_FILE=${SSL_CERT_FILE}
    extra_hosts:
      - "gitea.home.arpa:host-gateway"
    networks:
      - homelab-net
      - drone-net

  drone-runner:
    depends_on:
      - drone-server
    image: drone/drone-runner-docker:1.8
    container_name: drone-runner
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./ca-bundle.crt:/etc/ssl/certs/ca-bundle.crt:ro
    environment:
      - DRONE_RPC_PROTO=http
      - DRONE_RPC_HOST=drone-server:80
      - DRONE_RPC_SECRET=${DRONE_RPC_SECRET}
      - DRONE_RUNNER_CAPACITY=1
      - DRONE_RUNNER_NAME=runner
      - DRONE_RUNNER_VOLUMES=${DRONE_RUNNER_VOLUMES}
      - DRONE_RUNNER_ENVIRON=${DRONE_RUNNER_ENVIRON}
    networks:
      - drone-net

networks:
  homelab-net:
    external: true
  drone-net:
    name: drone-net

volumes:
  drone-data: 
    driver: local