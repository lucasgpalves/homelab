
version: "3.8"

services:
  zabbix-db:
    image: postgres:15-alpine
    container_name: zabbix-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - zabbix-db-data:/var/lib/postgresql/data
    networks:
      - zabbix-net

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    container_name: zabbix-server
    restart: unless-stopped
    depends_on:
      - zabbix-db
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "10051:10051"
    volumes:
      - zabbix-server-externalscripts:/usr/lib/zabbix/externalscripts
      - zabbix-server-mibs:/var/lib/zabbix/mibs
    networks:
      - zabbix-net

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    container_name: zabbix-web
    restart: unless-stopped
    depends_on:
      - zabbix-server
      - zabbix-db
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      zabbix_SERVER_HOST: zabbix-server
      PHP_TZ: ${PHP_TZ}
    ports:
      - "8080:8080"
    networks:
      - zabbix-net
      - homelab-net

  zabbix-agent2:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    container_name: zabbix-agent2
    restart: unless-stopped
    environment:
      zabbix_SERVER_HOST: zabbix-server
      zabbix_SERVER_PORT: 10051
      zabbix_HOSTNAME: ${AGENT_HOSTNAME}
    ports:
      - "10050:10050"
    volumes:
      - zabbix-agent2-d:/var/lib/zabbix
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - zabbix-net
      - homelab-net

networks:
  zabbix-net:
  homelab-net:
    external: true

volumes:
  zabbix-db-data:
  zabbix-server-externalscripts:
  zabbix-server-mibs:
  zabbix-agent2-d:
